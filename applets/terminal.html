<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GH Terminal</title><link rel="stylesheet" href="../styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script><script src="../ghcore.js"></script><style>
html,body{height:100%;margin:0}body{background:#000;color:#00ff55;padding:10px;box-sizing:border-box;font-family:monospace;overflow:hidden}.terminal{height:100%;display:flex;flex-direction:column}.screen{flex:1;overflow:auto;white-space:pre-wrap;line-height:1.35}.prompt{display:flex;border-top:1px solid #074;padding-top:5px}.prompt span{margin-right:6px}.input{flex:1;background:#000;color:#00ff55;border:0;outline:0;font:inherit}.hint{opacity:.7}
</style></head><body><div class="terminal"><div id="screen" class="screen"></div><div class="prompt"><span>GH&gt;</span><input id="input" class="input" autocomplete="off" spellcheck="false"></div></div><script>
(()=>{const screen=document.getElementById('screen'),input=document.getElementById('input');const p=window.parent;const out=s=>{screen.textContent+=s+'\n';screen.scrollTop=screen.scrollHeight};const help=()=>out('help  apps  games  recent  profile  open <app>  theme <name>  crt  notifications  clear  reboot');const commands={help,apps:()=>out(Object.keys(p.GHDesktop?.windows||{}).join('\n')||'No open apps'),games:()=>out((p.projects||[]).map(x=>x.title).join('\n')),recent:async()=>out((await p.GHCore.getRecent()).slice(0,10).map(x=>`${x.title}  ${new Date(x.at).toLocaleString()}`).join('\n')||'No launch history'),profile:async()=>{const x=await p.GHCore.getProfile();out(`${x.username} — ${x.title}\nID: ${x.id}`)},notifications:async()=>out((await p.GHCore.getNotifications()).slice(0,10).map(x=>x.title+': '+x.body).join('\n')||'No notifications'),clear:()=>{screen.textContent='';},crt:()=>p.document.getElementById('crt-toggle-btn')?.click(),reboot:()=>p.location.reload()};async function run(raw){const a=raw.trim().split(/\s+/),cmd=a.shift()?.toLowerCase();if(!cmd)return;if(cmd==='open'){const name=a.join(' ').toLowerCase();if(name.includes('file'))p.GHDesktop.files?.open();else if(name.includes('system'))p.GHDesktop.system?.open();else if(name.includes('chat'))p.document.getElementById('chat-launcher-btn')?.click();else if(name.includes('arcade'))p.document.getElementById('arcade-launcher-btn')?.click();else if(name.includes('paint'))p.document.getElementById('taskbar-paint-btn')?.click();else if(name.includes('note'))p.document.getElementById('taskbar-notes-btn')?.click();else out('Unknown app.');return}if(cmd==='theme'){const s=await p.GHCore.getSettings();await p.GHCore.setSettings({theme:a[0]||'classic'});await p.applyGHTheme();out('Theme set.');return}if(commands[cmd]){await commands[cmd]();return}out('Unknown command. Type "help".');}out('COLTON PROJECT LAUNCHER TERMINAL v1\nLocal shell. No server commands available.\nType "help" for commands.');input.focus();input.onkeydown=async e=>{if(e.key==='Enter'){out('GH> '+input.value);await run(input.value);input.value='';}};})();
</script></body></html>
