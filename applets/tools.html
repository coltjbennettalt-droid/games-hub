<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Developer Toolbox</title><link rel="stylesheet" href="../styles.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script><script src="../ghcore.js"></script><style>
body{margin:0;padding:8px;background:#c0c0c0;color:#000;font-family:W95FA,"MS Sans Serif",sans-serif;overflow:auto}.grid{display:grid;grid-template-columns:150px 1fr;gap:8px;min-height:100%}.tabs{border:2px inset #808080;padding:4px}.tabs button{width:100%;text-align:left;margin-bottom:4px}.tabs button.active{background:#000080;color:#fff}.pane{display:none}.pane.active{display:block}.box{background:#fff;border:2px inset #808080;padding:8px}.stack{display:flex;gap:6px;flex-wrap:wrap}.field{width:100%;min-height:130px;border:2px inset #808080;background:#fff;padding:6px;box-sizing:border-box;font-family:monospace;resize:vertical}.row{display:flex;gap:6px;align-items:center;margin:6px 0}.row input,.row select{flex:1;min-width:0}.result{font-family:monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f8f8f8;border:2px inset #808080;padding:7px;min-height:45px}.swatch{width:34px;height:34px;border:2px inset #808080;display:inline-block;vertical-align:middle}@media(max-width:650px){.grid{grid-template-columns:1fr}.tabs{display:grid;grid-template-columns:repeat(2,1fr)}.tabs button{margin:0}}
</style></head><body>
<div class="grid"><div class="tabs">
<button data-tab="json" class="active">JSON</button><button data-tab="base64">Base64</button><button data-tab="uuid">UUID</button><button data-tab="timestamp">Time</button><button data-tab="units">Units</button><button data-tab="color">Color</button>
</div><div>
<section id="json" class="pane active"><div class="panel"><div class="panel-title-bar"><span>JSON TOOL</span></div><div class="panel-body"><textarea id="json-in" class="field" placeholder='{"hello":"world"}'></textarea><div class="stack"><button id="json-format">Format</button><button id="json-minify">Minify</button><button id="json-copy">Copy</button></div><pre id="json-out" class="result"></pre></div></div></section>
<section id="base64" class="pane"><div class="panel"><div class="panel-title-bar"><span>BASE64</span></div><div class="panel-body"><textarea id="b64-in" class="field" placeholder="Text"></textarea><div class="stack"><button id="b64-enc">Encode</button><button id="b64-dec">Decode</button></div><pre id="b64-out" class="result"></pre></div></div></section>
<section id="uuid" class="pane"><div class="panel"><div class="panel-title-bar"><span>UUID GENERATOR</span></div><div class="panel-body"><button id="uuid-make">Generate UUID</button><pre id="uuid-out" class="result" style="margin-top:6px"></pre></div></div></section>
<section id="timestamp" class="pane"><div class="panel"><div class="panel-title-bar"><span>TIMESTAMP CONVERTER</span></div><div class="panel-body"><div class="row"><button id="time-now">Now</button><input id="time-in" type="text" placeholder="Unix ms or ISO date"></div><pre id="time-out" class="result"></pre></div></div></section>
<section id="units" class="pane"><div class="panel"><div class="panel-title-bar"><span>UNIT CONVERTER</span></div><div class="panel-body"><div class="row"><input id="unit-val" type="number" value="100"><select id="unit-kind"><option value="mph-kmh">mph → km/h</option><option value="kmh-mph">km/h → mph</option><option value="hp-kw">hp → kW</option><option value="kw-hp">kW → hp</option><option value="lbft-nm">lb-ft → N·m</option><option value="nm-lbft">N·m → lb-ft</option><option value="mi-km">miles → km</option><option value="km-mi">km → miles</option><option value="f-c">°F → °C</option><option value="c-f">°C → °F</option></select></div><pre id="unit-out" class="result"></pre></div></div></section>
<section id="color" class="pane"><div class="panel"><div class="panel-title-bar"><span>COLOR TOOL</span></div><div class="panel-body"><div class="row"><input id="color-in" type="text" value="#000080"><span id="swatch" class="swatch"></span></div><pre id="color-out" class="result"></pre></div></div></section>
</div></div>
<script>
(()=>{const $=id=>document.getElementById(id);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');});
$('json-format').onclick=()=>{try{$('json-out').textContent=JSON.stringify(JSON.parse($('json-in').value),null,2)}catch(e){$('json-out').textContent='ERROR: '+e.message}}; $('json-minify').onclick=()=>{try{$('json-out').textContent=JSON.stringify(JSON.parse($('json-in').value))}catch(e){$('json-out').textContent='ERROR: '+e.message}}; $('json-copy').onclick=async()=>{try{await navigator.clipboard.writeText($('json-out').textContent)}catch{}};
$('b64-enc').onclick=()=>{$('b64-out').textContent=btoa(unescape(encodeURIComponent($('b64-in').value)))}; $('b64-dec').onclick=()=>{try{$('b64-out').textContent=decodeURIComponent(escape(atob($('b64-in').value)))}catch(e){$('b64-out').textContent='ERROR: '+e.message}};
$('uuid-make').onclick=()=>{$('uuid-out').textContent=crypto.randomUUID?crypto.randomUUID():([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));};$('time-now').onclick=()=>{$('time-in').value=Date.now();convertTime();};$('time-in').oninput=convertTime;function convertTime(){const v=$('time-in').value.trim();let d=/^\d+$/.test(v)?new Date(Number(v)):new Date(v);$('time-out').textContent=Number.isNaN(d.getTime())?'Invalid date':`Unix ms: ${d.getTime()}\nISO: ${d.toISOString()}\nLocal: ${d.toLocaleString()}`};
$('unit-val').oninput=convertUnit;$('unit-kind').onchange=convertUnit;function convertUnit(){const v=Number($('unit-val').value),k=$('unit-kind').value, f={"mph-kmh":[v=>v*1.609344,'km/h'],"kmh-mph":[v=>v/1.609344,'mph'],"hp-kw":[v=>v*0.745699872,'kW'],"kw-hp":[v=>v/0.745699872,'hp'],"lbft-nm":[v=>v*1.355817948,'N·m'],"nm-lbft":[v=>v/1.355817948,'lb-ft'],"mi-km":[v=>v*1.609344,'km'],"km-mi":[v=>v/1.609344,'mi'],"f-c":[v=>(v-32)*5/9,'°C'],"c-f":[v=>v*9/5+32,'°F']}[k];$('unit-out').textContent=`${f[0](v)} ${f[1]}`};convertUnit();
$('color-in').oninput=()=>{let v=$('color-in').value.trim();try{if(!/^#?[0-9a-f]{6}$/i.test(v))throw new Error('Use a 6-digit hex color');v=v.startsWith('#')?v:'#'+v;$('swatch').style.background=v;const n=parseInt(v.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;$('color-out').textContent=`HEX: ${v.toUpperCase()}\nRGB: rgb(${r}, ${g}, ${b})\nCSS: color: ${v};`}catch(e){$('color-out').textContent='ERROR: '+e.message;$('swatch').style.background='transparent'}};$('color-in').dispatchEvent(new Event('input'));convertTime();
})();
</script></body></html>
